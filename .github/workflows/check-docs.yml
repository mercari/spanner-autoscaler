name: Check Docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: make crd-ref-docs

      - run: make docs

      - run: git diff --exit-code docs/crd-reference.md
