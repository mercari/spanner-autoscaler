name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        ## The version is pinned in go.mod (imported by tools/tools.go), so
        ## Dependabot's go-deps group bumps it in a reviewable PR instead of
        ## `latest` changing under existing PRs. This also keeps CI on the same
        ## version as `make lint`.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          install-mode: none ## use the go.mod-pinned binary installed above
          skip-cache: true ## caching leads to false positives even when lint errors are fixed in a subsequent commit on a PR
